# API key template: copy to config/secrets.yml (chmod 600), or set keys on the Keys tab of the web interface.
# To enable a key, delete only the leading '#' of its two lines: the indentation is already correct
# (every module must stay indented under 'modules:'). Keep only modules from the active set (bin/module list).
#
# Example:
#   modules:
#     virustotal:
#       api_key: "0123abcd..."

modules:
# censys_ip — Censys Platform Personal Access Token (required)
#  censys_ip:
#    api_key: ""
# certspotter — SSLMate API key (enables pagination and higher rate limits)
#  certspotter:
#    api_key: ""
# criminalip — Criminal IP API key (required)
#  criminalip:
#    api_key: ""
# fofa — FOFA API key (required)
#  fofa:
#    api_key: ""
# fullhunt — FullHunt API Key (required)
#  fullhunt:
#    api_key: ""
# git_clone — Github token
#  git_clone:
#    api_key: ""
# github_codesearch — Github token (required)
#  github_codesearch:
#    api_key: ""
# github_org — Github token
#  github_org:
#    api_key: ""
# github_usersearch — Github token (required)
#  github_usersearch:
#    api_key: ""
# github_workflows — Github token (required)
#  github_workflows:
#    api_key: ""
# hunterio — Hunter.IO API key (required)
#  hunterio:
#    api_key: ""
# ip2location — IP2location.io API Key (optional: keyless access is limited to 1,000 queries/day, a free key gives 50K/month)
#  ip2location:
#    api_key: ""
# leakix — LeakIX API Key (required)
#  leakix:
#    api_key: ""
# netlas — Netlas API key (optional: without it only the first 20 results)
#  netlas:
#    api_key: ""
# otx — OTX API key (required)
#  otx:
#    api_key: ""
# postman — Postman API Key (required)
#  postman:
#    api_key: ""
# postman_download — Postman API Key (required)
#  postman_download:
#    api_key: ""
# shodan_dns — Shodan API key (required)
#  shodan_dns:
#    api_key: ""
# shodan_idb — Shodan API key (optional, falls back to the shodan_dns key). With a key, the full host API is used instead of InternetDB (no query credits)
#  shodan_idb:
#    api_key: ""
# trickest — Trickest API key (required)
#  trickest:
#    api_key: ""
# urlscan — urlscan.io API key (optional, raises search quotas)
#  urlscan:
#    api_key: ""
# virustotal — VirusTotal API Key (required)
#  virustotal:
#    api_key: ""
